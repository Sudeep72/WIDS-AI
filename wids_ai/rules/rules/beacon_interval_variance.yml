id: WIDS-BEACON-001
title: Abnormal beacon interval variance
family: beacon_management_anomaly
description: Beacon interval readings vary far beyond normal jitter.
severity: high
scope: bssid
conditions:
  all:
    - field: beacon_interval_std
      operator: ge
      value: 50
    - field: beacon_count
      operator: ge
      value: 3
threshold: 50
threshold_field: beacon_interval_std
window: 10
cooldown: 30
attack_ref: beacon_anomaly
false_positive_notes: >-
  Threshold is more than six times the benign 99th percentile. Channel changes
  and packet loss can still elevate interval variance.