id: WIDS-BEACON-002
title: Duplicate or backward beacon sequence numbers
family: beacon_management_anomaly
description: Beacon sequence behavior is inconsistent for one BSSID stream.
severity: high
scope: bssid
conditions:
  all:
    - any:
        - field: seq_duplicate_count
          operator: ge
          value: 2
        - field: seq_gap_count
          operator: ge
          value: 2
    - field: trusted_sequence_reset_gap
      operator: eq
      value: 0
threshold: 0
threshold_field: frame_count
window: 10
cooldown: 30
attack_ref: beacon_anomaly
false_positive_notes: >-
  Threshold is above the benign 99th percentile for duplicate sequence numbers
  and sequence gaps. Packet loss and firmware resets can still create gaps.