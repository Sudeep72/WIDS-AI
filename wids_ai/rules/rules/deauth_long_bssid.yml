id: WIDS-DEAUTH-005
title: Cumulative deauthentication from one BSSID
family: deauth_disassoc_anomaly
description: A BSSID emits a sustained deauthentication volume across a five-minute window.
severity: high
scope: bssid
aggregation: rolling
conditions:
  all:
    - field: deauth_count
      operator: ge
      value: 6
threshold: 6
threshold_field: deauth_count
window: 300
cooldown: 300
attack_ref: deauth
false_positive_notes: >-
  Benign baseline and noisy benign have zero deauth frames. A sustained local reset or client reconnect can still create this pattern.
