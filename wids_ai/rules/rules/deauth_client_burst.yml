id: WIDS-DEAUTH-003
title: Per-client deauthentication burst
family: deauth_disassoc_anomaly
description: A client receives a high number of deauthentication frames.
severity: high
scope: client
conditions:
  all:
    - field: deauth_count
      operator: ge
      value: 5
threshold: 5
threshold_field: deauth_count
window: 10
cooldown: 20
attack_ref: deauth
false_positive_notes: >-
  Benign baseline has zero client deauth frames. Repeated association failures
  can produce a local burst.