[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wids-ai"
version = "0.1.0"
description = "Explainable ATT&CK-mapped wireless intrusion detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "joblib==1.6.0",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "pydantic==2.14.2",
  "PyYAML==6.0.3",
  "scapy==2.8.0",
  "scikit-learn==1.9.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[project.scripts]
wids-ai = "wids_ai.cli:main"

[tool.setuptools.packages.find]
include = ["wids_ai*"]

[tool.pytest.ini_options]
addopts = "--basetemp=.tmp/pytest"
cache_dir = ".tmp/pytest_cache"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["wids_ai"]
